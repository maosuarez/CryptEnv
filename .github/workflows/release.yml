name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.7.2)'
        required: true

permissions:
  contents: write

env:
  # Tag push → the pushed tag; manual run → the `tag` input. Every job builds and
  # publishes this ref, never the branch the workflow was dispatched from.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ─── WSL helper (static musl, bundled into the Windows installer) ────────────
  build-wsl-helper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build crypt-env-setup
        working-directory: src-tauri
        run: cargo build --release -p crypt-env-setup --target x86_64-unknown-linux-musl

      - name: Verify the helper is statically linked
        working-directory: src-tauri
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/crypt-env-setup
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -qv -e 'not a dynamic executable' -e 'statically linked' -e 'linux-vdso'; then
            echo "::error::crypt-env-setup is dynamically linked"; ldd "$BIN"; exit 1
          fi

      - name: Upload WSL helper
        uses: actions/upload-artifact@v4
        with:
          name: wsl-helper
          if-no-files-found: error
          path: src-tauri/target/x86_64-unknown-linux-musl/release/crypt-env-setup

  # ─── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    needs: [build-wsl-helper]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Download WSL helper
        uses: actions/download-artifact@v4
        with:
          name: wsl-helper
          path: wsl-helper

      # Stages crypt-env / crypt-env-mcp as sidecars + the WSL helper as a
      # resource, asserts the bundled CLI version equals the GUI version, then
      # builds with tauri.windows-bundle.conf.json merged in.
      - name: Build Tauri app (with CLI sidecars + WSL helper)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CRYPTENV_WSL_HELPER: wsl-helper/crypt-env-setup
        run: pnpm tauri:build:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/crypt-env-mcp.exe
            src-tauri/target/release/crypt-env.exe

  # ─── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/crypt-env-mcp
            src-tauri/target/release/crypt-env

  # ─── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/crypt-env-mcp
            src-tauri/target/release/crypt-env

  # ─── GitHub Release ───────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: dist/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/linux

      - name: Flatten release assets
        run: |
          mkdir -p release
          # Windows installer + sigs + CLI binaries
          find dist/windows -name "*.exe" | xargs -I{} cp {} release/
          find dist/windows -name "*.sig" | xargs -I{} cp {} release/
          # macOS .dmg (manual install) + .app.tar.gz + sig (updater artifact) + CLI binaries (renamed to avoid collision)
          find dist/macos -name "*.dmg" | xargs -I{} cp {} release/
          find dist/macos -name "*.app.tar.gz" | xargs -I{} cp {} release/
          find dist/macos -name "*.app.tar.gz.sig" | xargs -I{} cp {} release/
          find dist/macos -name "crypt-env" -not -name "*.exe" | xargs -I{} cp {} release/crypt-env-macos
          find dist/macos -name "crypt-env-mcp" -not -name "*.exe" | xargs -I{} cp {} release/crypt-env-mcp-macos
          # Linux .deb, .AppImage + sigs + CLI binaries
          find dist/linux -name "*.deb" | xargs -I{} cp {} release/
          find dist/linux -name "*.AppImage" | xargs -I{} cp {} release/
          find dist/linux -name "*.sig" | xargs -I{} cp {} release/
          find dist/linux -name "crypt-env" -not -name "*.exe" | xargs -I{} cp {} release/crypt-env-linux
          find dist/linux -name "crypt-env-mcp" -not -name "*.exe" | xargs -I{} cp {} release/crypt-env-mcp-linux
          echo "--- release assets ---"
          ls -lh release/

      - name: Generate latest.json for updater
        run: |
          VERSION="${RELEASE_TAG#v}"
          TAG="${RELEASE_TAG}"
          REPO="maosuarez/crypt-env"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Fail loudly instead of silently emitting an empty (invalid) signature.
          read_sig() {
            if [ ! -s "$1" ]; then
              echo "::error::missing or empty signature: $1" >&2
              exit 1
            fi
            cat "$1"
          }

          WIN_SIG=$(read_sig release/CryptEnv_${VERSION}_x64-setup.exe.sig)
          APP_TAR_SIG=$(read_sig release/CryptEnv.app.tar.gz.sig)
          APPIMAGE_SIG=$(read_sig release/CryptEnv_${VERSION}_amd64.AppImage.sig)

          cat > release/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${REPO}/releases/tag/${TAG} for details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE_URL}/CryptEnv_${VERSION}_x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "${APP_TAR_SIG}",
                "url": "${BASE_URL}/CryptEnv.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "${APPIMAGE_SIG}",
                "url": "${BASE_URL}/CryptEnv_${VERSION}_amd64.AppImage"
              }
            }
          }
          EOF
          echo "--- latest.json ---"
          cat release/latest.json

      - name: Verify updater signatures are present
        run: |
          python3 -c "
          import json, sys
          with open('release/latest.json') as f:
              data = json.load(f)
          empty = [p for p, v in data['platforms'].items() if not v.get('signature')]
          if empty:
              print(f'::error::empty signature for platform(s): {empty}')
              sys.exit(1)
          print('All platform signatures present.')
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # The build signs with whatever TAURI_SIGNING_PRIVATE_KEY holds. Installed
      # apps only accept the pubkey in tauri.conf.json, so a mismatched secret
      # would publish updates every client rejects. Fail here instead.
      - name: Verify updater signatures match tauri.conf.json pubkey
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/verify-updater-sig.mjs \
            "release/CryptEnv_${VERSION}_x64-setup.exe" \
            "release/CryptEnv.app.tar.gz" \
            "release/CryptEnv_${VERSION}_amd64.AppImage"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "CryptEnv ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          body: |
            ## Installation

            ### Windows
            Download the `*-setup.exe` installer and run it.

            ### macOS
            Download the `.dmg`, open it, and drag CryptEnv to Applications.

            ### Linux
            Download the `.deb` package and install with:
            ```
            sudo dpkg -i CryptEnv_*_amd64.deb
            ```
            Or use the `.AppImage` — make it executable and run it directly.

            ### CLI and MCP binaries
            | File | Platform |
            |------|----------|
            | `crypt-env.exe` / `crypt-env-mcp.exe` | Windows |
            | `crypt-env-macos` / `crypt-env-mcp-macos` | macOS |
            | `crypt-env-linux` / `crypt-env-mcp-linux` | Linux |

            Copy to a directory on your `PATH`.

            ### MCP Integration (Claude Code / Claude Desktop)
            After copying `crypt-env-mcp` to your PATH, add this to your agent config:
            ```json
            {
              "mcpServers": {
                "crypt-env": {
                  "command": "crypt-env-mcp",
                  "args": []
                }
              }
            }
            ```
            The main CryptEnv app must be running and unlocked. Generate an MCP token in **Settings → Integrations**.
          files: release/*
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
